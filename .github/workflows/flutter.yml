name: Flutter CI · analyze, test e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Gerar wrapper Gradle (ausente no repositório)
        run: |
          TMP_DIR="$(mktemp -d)"
          flutter create --project-name territorio_vivo --org br.fiap --platforms android --no-pub "$TMP_DIR/scaffold"
          cp "$TMP_DIR/scaffold/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          cp "$TMP_DIR/scaffold/android/gradlew" "$TMP_DIR/scaffold/android/gradlew.bat" android/
          chmod +x android/gradlew

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: territorio-vivo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
