name: Flutter CI · analyze, test e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões
        run: flutter --version

      - name: Gerar wrapper Gradle (ausente no repositório)
        run: |
          TMP_DIR="$(mktemp -d)"
          flutter create --project-name territorio_vivo --org br.fiap --platforms android --no-pub "$TMP_DIR/scaffold"
          cp "$TMP_DIR/scaffold/android/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          cp "$TMP_DIR/scaffold/android/gradlew" "$TMP_DIR/scaffold/android/gradlew.bat" android/
          chmod +x android/gradlew

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos

      - name: Testes
        run: flutter test

      - name: APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: territorio-vivo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Território Vivo · build ${{ github.run_number }}
          body: |
            APK de demonstração (release assinado com chave de debug), gerado automaticamente após `flutter analyze` e `flutter test` aprovados.
            Para instalar: baixe `app-release.apk` no Android e permita instalação de fontes desconhecidas.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
